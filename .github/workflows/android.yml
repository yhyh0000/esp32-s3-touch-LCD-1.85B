name: Android app checks

on:
  push:
    paths:
      - "platforms/android/**"
      - "shared/ble_protocol/**"
      - "shared/coordinates/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "platforms/android/**"
      - "shared/ble_protocol/**"
      - "shared/coordinates/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build, unit test and lint
        working-directory: platforms/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-gps-android-debug-${{ github.sha }}
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
